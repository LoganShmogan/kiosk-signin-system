{% extends 'base.html' %}
{% block title %}Edit Dashboard User — Kiosk Sign-In{% endblock %}

{% block content %}
<h1 class="page-title">Edit Dashboard User</h1>
<p class="page-subtitle">Editing {{ user.name }}</p>

<div class="form-card">
    <form method="POST" action="{{ url_for('dashboard_user_edit', user_id=user.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required value="{{ user.name }}">
            </div>
            <div class="form-group">
                <label>New password (optional)</label>
                <input type="password" name="pin" minlength="10" placeholder="Leave blank to keep the current password">
            </div>
        </div>
        <div class="form-group">
            <label>Access Level</label>
            <div class="radio-row">
                <label class="radio-opt"><input type="radio" name="role" value="staff" {% if user.role == 'staff' %}checked{% endif %}> Staff (Sign In / Out only)</label>
                <label class="radio-opt"><input type="radio" name="role" value="admin" {% if user.role == 'admin' %}checked{% endif %}> Admin (full access)</label>
            </div>
        </div>
        <div class="form-group">
            <label>Linked staff member (optional)</label>
            <select name="member_id">
                <option value="">-- none --</option>
                {% for s in staff %}
                <option value="{{ s.id }}" {% if user.member_id == s.id %}selected{% endif %}>{{ s.first_name }} {{ s.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Save Changes</button>
            <a href="{{ url_for('dashboard_users') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
