name: Build

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:

  # ── Windows (works for both regular PC and kiosk) ──────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --add-data "dashboard/templates;dashboard/templates" --add-data "dashboard/static;dashboard/static" --add-data "dashboard/app.py;dashboard" --add-data "kiosk_signin/export_util.py;kiosk_signin" --hidden-import flask --hidden-import flask_wtf --hidden-import flask_limiter --hidden-import dotenv --hidden-import waitress --hidden-import werkzeug --collect-submodules werkzeug --hidden-import xhtml2pdf --collect-submodules xhtml2pdf --collect-data xhtml2pdf kiosk_signin/app.py --name KioskSignIn-Windows

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KioskSignIn-Windows.exe

  # ── Pop!_OS / Linux x86_64 ─────────────────────────────────────────────────
  # Built on Ubuntu 22.04 to match Pop!_OS 22.04 LTS glibc version
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --add-data "dashboard/templates:dashboard/templates" --add-data "dashboard/static:dashboard/static" --add-data "dashboard/app.py:dashboard" --add-data "kiosk_signin/export_util.py:kiosk_signin" --hidden-import flask --hidden-import flask_wtf --hidden-import flask_limiter --hidden-import dotenv --hidden-import waitress --hidden-import werkzeug --collect-submodules werkzeug --hidden-import xhtml2pdf --collect-submodules xhtml2pdf --collect-data xhtml2pdf kiosk_signin/app.py --name KioskSignIn-Linux-x64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KioskSignIn-Linux-x64
